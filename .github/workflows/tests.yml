name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 matches the Python interpreter bundled with Sublime Text 4
        # (.python-version) -- this is what actually runs the plugin.
        # 3.12 is a forward-compatibility check for contributors on newer
        # local Pythons.
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v
